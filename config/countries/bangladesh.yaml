flagship_vertical:
  code: "climact_twin"
  title_en: "ClimAct Twin: Urban Heat, Air Quality & Flood Resilience Simulator"
  title_bn: "ক্লাইমঅ্যাক্ট টুইন: নগর তাপদাহ, বায়ুমান ও বন্যা সহনশীলতা সিমুলেটর"
  key_hazards:
    - code: "heat"
      name: "Extreme Urban Heat & Heatwave Anomaly"
      indicator: "apparent_temp_anomaly_c"
      threshold_critical: 40.0
    - code: "air_quality"
      name: "Particulate Matter PM2.5 Pollution"
      indicator: "pm25_ug_m3"
      threshold_critical: 75.0
    - code: "flood"
      name: "Monsoon & River Discharge Flood Exposure"
      indicator: "glofas_p75_discharge"
      threshold_critical: 0.85
    - code: "low_elevation"
      name: "Low-lying Elevation & Storm Inundation"
      indicator: "elevation_p10_m"
      threshold_critical: 5.0

institutions:
  statistics: "Bangladesh Bureau of Statistics (BBS)"
  hydrology: "Bangladesh Water Development Board (BWDB) / FFWC"
  meteorology: "Bangladesh Meteorological Department (BMD)"
  environment: "Department of Environment (DoE)"
  planning: "Ministry of Planning / Local Government Division (LGD)"
  urban_dev: "Rajdhani Unnayan Kartripakkha (RAJUK)"

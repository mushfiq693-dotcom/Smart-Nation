flagship_vertical:
  code: "climact_twin_dhaka"
  title_en: "ClimAct Dhaka: Megacity Heat Island, Air Quality & Waterlogging Twin"
  title_bn: "ক্লাইমঅ্যাক্ট ঢাকা: মেগাসিটি তাপদ্বীপ, বায়ুদূষণ ও জলাবদ্ধতা ডিজিটাল টুইন"
  key_hazards:
    - code: "urban_heat_island"
      name: "Urban Heat Island (UHI) & Surface Temp Anomaly"
      indicator: "apparent_temp_anomaly_c"
      threshold_critical: 38.0
    - code: "particulate_air_pollution"
      name: "Particulate Matter PM2.5 Exposure"
      indicator: "pm25_ug_m3"
      threshold_critical: 85.0
    - code: "urban_waterlogging"
      name: "Monsoon Waterlogging & Drainage Flash Flood"
      indicator: "waterlogging_risk_index"
      threshold_critical: 0.70
    - code: "green_canopy_deficit"
      name: "Tree Canopy Deficit & Built-up Density"
      indicator: "impervious_surface_fraction"
      threshold_critical: 0.75

